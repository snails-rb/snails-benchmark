server {
  listen 3000;
  server_name _;

  keepalive_timeout 65;

  # The generator-ceiling baseline for the item-read scenario. It answers any
  # /items/<id> with the same body and size as item 1, so the app's DB and
  # framework cost stay out of the ceiling measurement. It is not a DB baseline;
  # db.tsv records the query plan separately.
  access_log off;

  location /items/ {
    default_type application/json;
    return 200 '{"id":1,"name":"item-1","description":"description-1","price":101,"status":"inactive"}';
  }
}
