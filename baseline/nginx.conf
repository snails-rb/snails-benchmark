# Baseline server: the cheapest possible answer to GET /up.
#
# Its job is to show the ceiling this host can produce under the same core
# split as the two frameworks. When Snails and Rails both land on this
# number, the load generator is the bottleneck, not the app.
#
# It listens on 3000 like both apps, so the harness treats all three the same.
server {
  listen 3000;
  server_name _;

  keepalive_timeout 65;

  # No access log. Both app profiles log one line per request by default, so
  # the baseline stays silent to be the floor, and the logged/unlogged
  # comparison is made between the two apps instead.
  access_log off;

  location = /up {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
